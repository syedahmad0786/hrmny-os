name: HRMNY production migration 0068-0074

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Canonical Supabase project ref
        required: true
        type: string
      backup_receipt:
        description: Backup or PITR receipt reference verified before this run
        required: true
        type: string
      confirmation:
        description: Type APPLY ADDITIVE MIGRATIONS 0068 THROUGH 0074 TO HRMNY PRODUCTION
        required: true
        type: string
      reviewed_sha:
        description: Exact reviewed main commit SHA to execute
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hrmny-production-database-migration
  cancel-in-progress: false

jobs:
  retired:
    name: Refuse obsolete 0068-0074 runner
    runs-on: ubuntu-latest
    steps:
      - name: Stop before secrets, dependencies, or database access
        shell: bash
        run: |
          echo "::error::The 0068-0074 production runner is retired and cannot access production. Use the separately reviewed 0075 workflow only after an exact human checkpoint."
          exit 1
