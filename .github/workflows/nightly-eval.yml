name: hrmny OS nightly AI eval

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic agent eval harness
        env:
          LLM_PROVIDER: mock
          OPENROUTER_LIVE_SMOKE: "0"
          LLM_MONTHLY_CAP_AED: "1500"
        run: pnpm --filter @hrmny/ai test
