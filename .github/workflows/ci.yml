name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hrmny/web build
      - run: pnpm --filter @hrmny/web exec playwright install chromium --with-deps
      - name: Start local acceptance server
        env:
          AUTH_MODE: "dev"
          ALLOW_MEMORY_STORE: "true"
          DAM_STORAGE: "memory"
          VERCEL_ENV: "development"
        run: |
          (cd apps/web && pnpm exec next dev --port 3000 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
      - name: Run Playwright e2e
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
        run: pnpm --filter @hrmny/web e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m1-browser-evidence
          path: apps/web/test-results

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.141
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify fresh and upgrade migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_TEST_ALLOW_DROP: "true"
        run: pnpm db:verify
