name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_MODE: memory
      DATABASE_URL: ""
      LLM_PROVIDER: mock
      OPENROUTER_LIVE_SMOKE: "0"
      EMBEDDING_PROVIDER: none
      APOLLO_MODE: mock
      HUNTER_MODE: mock
      NEVERBOUNCE_MODE: mock
      RESEND_MODE: mock
      N8N_MODE: mock
      XERO_MODE: mock
      XERO_WRITE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_MODE: memory
      DATABASE_URL: ""
      AUTH_MODE: dev
      ALLOW_DEV_AUTH: "true"
      WORK_ENVIRONMENT_KIND: sandbox
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: none
      APOLLO_MODE: mock
      APOLLO_ALLOW_PAID_OPERATIONS: "false"
      HUNTER_MODE: mock
      HUNTER_ALLOW_PAID_OPERATIONS: "false"
      NEVERBOUNCE_MODE: mock
      NEVERBOUNCE_ALLOW_PAID_OPERATIONS: "false"
      RESEND_MODE: mock
      XERO_MODE: mock
      XERO_WRITE_ENABLED: "false"
      COMPOSIO_API_KEY: ""
      GOOGLE_CHAT_WEBHOOK_URL: ""
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dev-auth acceptance app
        env:
          AUTH_MODE: dev
          ALLOW_DEV_AUTH: "true"
          LLM_PROVIDER: mock
        run: pnpm --filter @hrmny/web build
      - run: pnpm --filter @hrmny/web exec playwright install chromium --with-deps
      - name: Start production server
        env:
          AUTH_MODE: dev
          ALLOW_DEV_AUTH: "true"
          LLM_PROVIDER: mock
        run: |
          (cd apps/web && pnpm exec next start --port 3000 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
      - name: Run Playwright e2e
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
          AUTH_MODE: dev
          ALLOW_DEV_AUTH: "true"
          LLM_PROVIDER: mock
        run: pnpm --filter @hrmny/web e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.141
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify fresh and upgrade migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MIGRATION_TEST_ALLOW_DROP: "true"
          MIGRATION_TEST_RETAIN_FRESH_FOR_PROOF: "true"
        run: pnpm db:verify
      - name: Apply migrations to disposable runtime database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm db:migrate
      - name: Prove Sales proposal runtime on PostgreSQL
        env:
          DATABASE_MODE: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          HRMNY_CI_POSTGRES_WRITE: "true"
          HRMNY_DATABASE_SSL_MODE: disable
          LLM_PROVIDER: mock
          OPENROUTER_LIVE_SMOKE: "0"
          EMBEDDING_PROVIDER: none
          APOLLO_MODE: mock
          APOLLO_ALLOW_PAID_OPERATIONS: "false"
          HUNTER_MODE: mock
          HUNTER_ALLOW_PAID_OPERATIONS: "false"
          NEVERBOUNCE_MODE: mock
          NEVERBOUNCE_ALLOW_PAID_OPERATIONS: "false"
          RESEND_MODE: mock
          N8N_MODE: mock
          XERO_MODE: mock
          XERO_WRITE_ENABLED: "false"
        run: pnpm --filter @hrmny/web test:ci:postgres
      - name: Prove Apollo receipt and queue concurrency
        env:
          CI: "true"
          DATABASE_MODE: postgres
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hrmny_migration_fresh
          CI_POSTGRES_PROOF: "true"
          HRMNY_CI_POSTGRES_WRITE: "true"
          HRMNY_DATABASE_SSL_MODE: disable
          LLM_PROVIDER: mock
          OPENROUTER_LIVE_SMOKE: "0"
          EMBEDDING_PROVIDER: none
          APOLLO_MODE: mock
          APOLLO_ALLOW_PAID_OPERATIONS: "false"
          HUNTER_MODE: mock
          HUNTER_ALLOW_PAID_OPERATIONS: "false"
          NEVERBOUNCE_MODE: mock
          NEVERBOUNCE_ALLOW_PAID_OPERATIONS: "false"
          RESEND_MODE: mock
          N8N_MODE: mock
          XERO_MODE: mock
          XERO_WRITE_ENABLED: "false"
        run: pnpm --filter @hrmny/web test:ci:apollo-postgres
